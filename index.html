<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Reto Antsoain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
</head>
<body>
<style>
/* Layout: una columna (dos en tablet); arriba el recorrido del equipo, abajo pestañas. Tema claro único, botones grandes: lo usan fisios y lo miran los usuarios del centro de día. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --sunk:#ECEEE6; --ink:#2B2D28; --muted:#6B6F65; --line:#E0E2D9;
  --accent:#5F8443; --accent-dark:#4A6A33; --accent-soft:#E4EDD9;
  --prog:#F2B01E; --prog-dark:#B57F00; --prog-soft:#FFF3D1;
  --done:#A6D47A; --done-dark:#5E8F2F; --done-soft:#EEF8E4;
  --ai:#46598A; --ai-soft:#E3E8F3; --sakura:#E58D9C; --kohaku:#D49A3A; --danger:#B9473F;
  --leaf:#7FA35C; --leaf-2:#9DBE7A; --seed:#C9A27A; --face:#2F302C; --blush:#F0A3AE; --sun:#F2C94C;
  --f:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
h1{margin:0;font:700 1.35rem/1.2 var(--f)}
h2{margin:0;font:700 1.15rem/1.3 var(--f)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.card{background:var(--surface);border-radius:22px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 1rem var(--f);min-height:52px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.big{min-height:64px;font-size:1.15rem;width:100%;border-radius:20px}
.btn.soft{background:var(--accent-soft);color:var(--accent-dark)}
.btn.ghost{background:none;color:var(--muted);border:2px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:2px solid var(--danger)}
.btn.danger.sure{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45}
.link{border:0;background:none;color:var(--accent-dark);font:700 1rem var(--f);padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 12px;font:500 1.05rem var(--f)}
label.f{display:grid;gap:4px;font:700 .95rem var(--f)}
label.f span.h{font:500 .85rem var(--f);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* cabecera */
.head{display:flex;align-items:center;gap:12px}
.head .logo{width:46px;height:50px;flex:none}
.head .t{flex:1;min-width:0}
.head .t small{display:block;color:var(--muted);font-size:.88rem}
.soundbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.soundbtn svg{width:22px;height:22px}

/* recorrido */
.route{display:grid;gap:10px}
.route .big-pct{font:700 2.6rem/1 var(--f);color:var(--accent-dark);font-variant-numeric:tabular-nums}
.route .lead{font:700 1.05rem var(--f)}
.ends{display:flex;justify-content:space-between;gap:10px;font:700 .92rem/1.3 var(--f)}
.ends span:last-child{text-align:right}
.ends small{display:block;font:500 .78rem var(--f);color:var(--muted)}
.mapbox{background:var(--sunk);border-radius:18px;padding:4px 2px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:.88rem;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none}
.legend i.ring{background:none;border:4px solid var(--prog)}
.legend i.ring.ok{border-color:var(--done)}
.count{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.count div{background:var(--sunk);border-radius:14px;padding:10px 12px}
.count b{display:block;font:700 1.3rem var(--f);font-variant-numeric:tabular-nums}
.count span{font-size:.82rem;color:var(--muted)}
.how{background:var(--sunk);border-radius:14px;padding:0 14px}
.how summary{min-height:48px;display:flex;align-items:center;font:700 1rem var(--f);cursor:pointer}
.how div{padding-bottom:12px;font-size:.95rem}
.how p{margin:6px 0}
.placelist{display:grid;gap:12px}
.pnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:700 .85rem var(--f);margin-right:4px}.how ul{margin:6px 0;padding-left:20px}

/* barras de progreso: amarillo mientras avanza, verde clarito si está conseguido */
.bar{width:100%;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--prog);border-radius:99px}
.bar i.ok{background:var(--done)}
.pctv{font:700 .95rem var(--f);color:var(--prog-dark)}
.pctv.ok{color:var(--done-dark)}

/* personas */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pc{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 10px;display:grid;justify-items:center;align-content:start;gap:6px;text-align:center}
.pc svg.pipa{width:90px;height:97px}
.pc b{font:700 1.1rem var(--f)}
.pc .goal{font-size:.88rem;color:var(--ink);line-height:1.35}
.pc .nogoal{font-size:.88rem;color:var(--prog-dark);font-weight:700}
.add-card{border:2px dashed var(--line);background:none;color:var(--muted);min-height:200px;font:700 1rem var(--f);place-content:center}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px}
.prow svg.pipa{width:56px;height:60px}
.prow b{font:700 1.05rem var(--f)}

/* sesión */
.sesshead{display:grid;gap:12px}
.slist{display:grid;gap:12px;align-items:start}
.srow{border:2px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:12px;background:var(--surface)}
.srow.on{border-color:var(--accent);background:#FBFDF8}
.shead{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.shead svg.pipa{width:110px;height:119px}
.sinfo{display:grid;gap:4px;min-width:0}
.sname{font:700 1.45rem/1.15 var(--f)}
.sgoal{font:700 1.05rem/1.35 var(--f);color:var(--ink)}
.sfrom{font-size:.92rem;color:var(--muted)}
.sinfo .bar{margin-top:4px}
.nogoal-box{background:var(--prog-soft);border-radius:14px;padding:8px 12px;font:700 .95rem/1.35 var(--f);color:var(--prog-dark)}
.att{min-height:60px;width:100%;border-radius:18px;border:3px dashed var(--line);background:var(--surface);font:700 1.15rem var(--f);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px}
.att[aria-pressed="true"]{background:var(--accent);border:3px solid var(--accent);color:#fff}
.att svg{width:26px;height:26px}
.srow .ctl{display:grid;gap:10px}
.qlbl{font:700 1rem var(--f)}
.qlbl small{font:500 .88rem var(--f);color:var(--muted)}
.borg{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:620px}
.borg button{height:50px;min-width:0;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 1.05rem var(--f);padding:0}
.borg button[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
.borgv{font:700 .95rem var(--f);color:var(--ai)}
.meas{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meas input{max-width:170px;font-size:1.15rem}
.meas span{font:700 1rem var(--f)}
.sticky-save{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5}

/* ficha */
.prof{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.prof svg.pipa{width:150px;height:162px}
.prof .goalbig{font:700 1.2rem/1.35 var(--f)}
.stage{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:4px 12px;font:700 .88rem var(--f)}
.chart svg{display:block;width:100%;max-width:640px;height:auto}
.mlist{display:grid;gap:0}
.mlist div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mlist div:first-child{border-top:0}
.mlist button{border:0;background:none;color:var(--muted);font:700 .9rem var(--f);min-height:44px;padding:0 8px}
.mlist button.sure{color:var(--danger)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:48px;height:48px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.accs{display:flex;gap:8px;flex-wrap:wrap}
.accs button{min-height:48px;border-radius:999px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font:700 .95rem var(--f)}
.accs button[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}

/* pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{display:grid;justify-items:center;padding:6px 0;text-decoration:none;color:var(--muted);font:700 .85rem var(--f);gap:2px;border-radius:12px}
.tabbar a svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--accent-dark);background:var(--accent-soft)}

/* capas */
.layer{position:fixed;inset:0;z-index:30;background:rgba(43,45,40,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.dialog{background:var(--surface);border-radius:24px;padding:20px;width:100%;max-width:520px;max-height:100%;overflow-y:auto;display:grid;gap:14px;position:relative}
.dialog.cel{justify-items:center;text-align:center;overflow:hidden}
.dialog.cel svg.pipa{width:130px;height:140px}
.dialog ul{margin:0;padding-left:20px;text-align:left;display:grid;gap:4px}
.confetti{position:absolute;top:-20px;width:11px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--leaf-2);animation:conf 1.8s ease-in forwards}
@keyframes conf{to{transform:translateY(480px) rotate(160deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font:700 1rem var(--f);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:26px 16px;display:grid;gap:12px;justify-items:center}
.empty svg.pipa{width:110px;height:118px}
.pipa .lf{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:860px){
  .teamgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
  .slist{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .prof{grid-template-columns:1fr;justify-items:center;text-align:center}
  .count b{font-size:1.1rem}
  .shead{grid-template-columns:88px minmax(0,1fr);gap:10px}
  .shead svg.pipa{width:88px;height:95px}
  .sname{font-size:1.3rem}
  .borg{gap:3px}
  .borg button{height:46px;font-size:.95rem;border-radius:10px}
}
@media print{
  .tabbar,.noprint,.toast{display:none!important}
  body{background:#fff}
  .wrap{padding:0}
  .card{border:1px solid #ddd}
}
</style>

<div class="wrap" id="main">
  <header class="head noprint">
    <div class="logo" id="logo"></div>
    <div class="t"><h1 id="title">Reto Antsoain</h1><small id="subtitle"></small></div>
    <button class="soundbtn" id="soundbtn" aria-label="Sonido"></button>

<script>
(function(){
/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const pd=s=>new Date(s+"T12:00:00");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v==null||v==="")return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=(n,d=0)=>n==null||!isFinite(n)?"—":n.toLocaleString("es-ES",{maximumFractionDigits:d});
const fmtD=s=>pd(s).toLocaleDateString("es-ES",{day:"numeric",month:"short"});
const fmtDL=s=>pd(s).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
const uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();

/* ---------- datos (en este dispositivo) ---------- */
const KEY="reto-antsoain.v1";
const DEF={title:"Reto Antsoain",start:"Sede de la asociación",end:"Plaza del Ayuntamiento",startDate:"2026-11-16",endDate:"2027-05-31",sound:true};
const CENTRO=["Marta","Bea","Angelines","Txarly","Esteban","Sara","Marijo","Asun","Oihana","Rosa","Martín","Khalid","Marian M","Marian C"];
const noGoal=()=>({text:"",unit:"metros",start:null,target:null});
let D=null;
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  D=d&&typeof d==="object"?d:{};
  D.settings={...DEF,...(D.settings||{})};D.people=Array.isArray(D.people)?D.people:[];D.sessions=D.sessions||{};
  D.people.forEach(p=>{p.goal=p.goal||noGoal();p.measures=p.measures||[];p.banked=p.banked||0});
  // v2: las Pipas del centro empiezan sin vestir (maceta de barro, sin complementos)
  if((D.v||1)<2){D.people.forEach(p=>{if(CENTRO.includes(p.name)&&!hasGoal(p)){p.pot="barro";p.acc="ninguno"}});D.v=2}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("No se pudo guardar en este dispositivo")}}
function addCentro(){
  const have=new Set(D.people.map(p=>p.name.trim().toLowerCase()));let n=0;
  CENTRO.forEach((name,i)=>{if(have.has(name.toLowerCase()))return;D.people.push({id:uid(),name,pot:"barro",acc:"ninguno",goal:noGoal(),measures:[],banked:0,created:today()});n++});
  return n;
}
load();
// la primera vez, ya aparecen los 14 participantes del centro (sin reto todavía)
if(!D.seeded){if(!D.people.length)addCentro();D.seeded=true}
save();

/* ---------- progreso ---------- */
function hasGoal(p){return !!(p.goal&&p.goal.start!=null&&p.goal.target!=null&&p.goal.start!==p.goal.target)}
function goalMeasures(p){return (p.measures||[]).filter(m=>!p.goal.since||m.d>=p.goal.since).sort((a,b)=>a.d<b.d?-1:1)}
function current(p){const m=goalMeasures(p);return m.length?m[m.length-1].v:p.goal.start}
// progreso en su reto actual: cuenta la MEJOR marca, así una mala racha no le quita nada
function pct(p){
  if(!hasGoal(p))return 0;const g=p.goal;
  const best=Math.max(0,...goalMeasures(p).map(m=>(m.v-g.start)/(g.target-g.start)));
  return Math.max(0,Math.min(1,best));
}
const STAGES=["semilla","brote","plantita","planta","en flor"];
const stageOf=r=>r>=1?4:r>=.75?3:r>=.5?2:r>=.25?1:0;
/* puntos para el reto del equipo: se acumulan y nunca se pierden */
const PTS={att:10,goal:100};
function effortPoints(p){let t=0;for(const s of Object.values(D.sessions)){if(s.att&&s.att[p.id])t+=PTS.att+(s.borg&&s.borg[p.id]!=null?s.borg[p.id]:0)}return t}
function progressPoints(p){return (p.banked||0)+Math.round(PTS.goal*pct(p))}
const personPoints=p=>effortPoints(p)+progressPoints(p);
const teamPoints=()=>D.people.reduce((a,p)=>a+personPoints(p),0);
function mondaysBetween(a,b){const s=pd(a),e=pd(b);if(isNaN(s)||isNaN(e)||e<s)return 0;const d=new Date(s);d.setDate(d.getDate()+((8-d.getDay())%7));let n=0;for(;d<=e;d.setDate(d.getDate()+7))n++;return n}
// meta del equipo: unos 2/3 de lo máximo posible (venir todos los lunes con esfuerzo medio y cumplir el reto)
function teamTarget(){const M=Math.max(1,mondaysBetween(D.settings.startDate,D.settings.endDate));return Math.max(100,Math.round(D.people.length*(M*(PTS.att+5)+PTS.goal)*.65/100)*100)}
const teamPct=()=>D.people.length?Math.min(1,teamPoints()/teamTarget()):0;
// la Pipa nunca encoge: crece con todo el progreso que lleva (también el de retos anteriores)

const ACCS=[["ninguno","Nada"],["cinta","Cinta"],["gorra","Gorra"],["gorro","Gorro"],["gafas","Gafas de sol"],["sombrero","Sombrero"],["cascos","Cascos"],["bufanda","Bufanda"]];

  if(stage>=2)top+=leaf(38,stage>=3?1.05:.85);

  if(stage>=4)top+=[0,72,144,216,288].map(a=>`<ellipse cx="50" cy="1" rx="3.6" ry="5.2" fill="var(--blush)" transform="rotate(${a} 50 6)"/>`).join("")+`<circle cx="50" cy="6" r="3.2" fill="var(--sun)"/>`;

    if(mood==="radiant")extra=[[14,40],[86,34],[10,66],[90,62]].map(([x,y])=>`<path d="M${x} ${y-5} L${x+1.4} ${y-1.4} L${x+5} ${y} L${x+1.4} ${y+1.4} L${x} ${y+5} L${x-1.4} ${y+1.4} L${x-5} ${y} L${x-1.4} ${y-1.4} Z" fill="var(--sun)"/>`).join("")}
  const blush=`<circle cx="35" cy="63" r="3.4" fill="var(--blush)" opacity=".6"/><circle cx="65" cy="63" r="3.4" fill="var(--blush)" opacity=".6"/>`;
  const a=p.acc||"ninguno";let acc="";
  if(a==="cinta")acc=`<path d="M28.5 48 q21.5 -9 43 0 v6.5 q-21.5 -9 -43 0z" fill="var(--sakura)"/><path d="M71 49 l7 -3 l-2 7z" fill="var(--sakura)"/>`;
  if(a==="gorra")acc=`<path d="M28.5 50 q0 -20 21.5 -20 q21.5 0 21.5 20 z" fill="var(--kohaku)"/><path d="M50 50 h29 q4 0 1.5 4.5 h-30.5 z" fill="#BC8A36"/><circle cx="50" cy="30.5" r="2.2" fill="#BC8A36"/>`;
  if(a==="gorro")acc=`<path d="M29 49 q0 -22 21 -22 q21 0 21 22z" fill="var(--ai)"/><rect x="27" y="44" width="46" height="8" rx="4" fill="#E9EEF7"/><circle cx="50" cy="26" r="4.5" fill="#E9EEF7"/>`;
  if(a==="gafas")acc=`<rect x="34" y="51.5" width="14" height="9" rx="3.5" fill="#2B2D28"/><rect x="52" y="51.5" width="14" height="9" rx="3.5" fill="#2B2D28"/><path d="M48 55 h4 M34 54 l-6 -2 M66 54 l6 -2" stroke="#2B2D28" stroke-width="2" stroke-linecap="round"/>`;
  if(a==="sombrero")acc=`<path d="M17 45 Q50 51 83 45 Q78 40 64 40 Q62 28 50 27 Q38 28 36 40 Q22 40 17 45Z" fill="#E9CF95"/><path d="M36.5 39.5 Q50 43 63.5 39.5 L63 36 Q50 39 37 36Z" fill="#D98A98"/>`;
  if(a==="cascos")acc=`<path d="M27 58 v-4 a23 23 0 0 1 46 0 v4" fill="none" stroke="#2B2D28" stroke-width="3.5"/><rect x="23" y="53" width="9" height="15" rx="4" fill="#2B2D28"/><rect x="68" y="53" width="9" height="15" rx="4" fill="#2B2D28"/>`;
  if(a==="bufanda")acc=`<path d="M30 74 q20 8 40 0 v6 q-20 8 -40 0z" fill="var(--sakura)"/><path d="M60 79 l3 12 h7 l-4 -13z" fill="var(--sakura)"/>`;

let AC=null;
function ac(){if(!D.settings.sound)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==="suspended")AC.resume()}catch(e){return null}return AC}
function note(c,t,f1,f2,dur,type="sine",vol=.2){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05)}
const SND={
  tap(){const c=ac();if(c)note(c,c.currentTime+.01,760,0,.06,"sine",.08)},
  save(){const c=ac();if(!c)return;const t=c.currentTime+.01;[523,659,784].forEach((f,i)=>note(c,t+i*.1,f,0,.25,"triangle",.2))},
  goal(){const c=ac();if(!c)return;const t=c.currentTime+.01;[523,659,784,1047].forEach((f,i)=>note(c,t+i*.13,f,0,.32,"triangle",.22));[523,659,784].forEach(f=>note(c,t+.6,f,0,.9,"sine",.1))}
};

const ROUTE="M60 470 H 850 C 960 470 960 300 850 300 H 170 C 60 300 60 130 170 130 H 900";
function routeSVG(){
  const tp=teamPct();
  return `<svg viewBox="0 30 1000 530" id="routesvg" role="img" aria-label="Recorrido del equipo: ${Math.round(tp*100)} por ciento">
    <path d="${ROUTE}" fill="none" stroke="#D6D9CE" stroke-width="30" stroke-linecap="round"/>
    <path d="${ROUTE}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 16" stroke-linecap="round"/>
    <path id="rprog" d="${ROUTE}" fill="none" stroke="var(--accent)" stroke-width="30" stroke-linecap="round" stroke-dasharray="0 3000"/>
    <circle cx="60" cy="470" r="16" fill="var(--ink)"/><circle cx="60" cy="470" r="6" fill="#fff"/>
    <path d="M900 130 V58" stroke="var(--ink)" stroke-width="5"/><path d="M900 58 l44 13 l-44 13z" fill="var(--sakura)"/>
    <g id="rstations"></g><g id="rguide"></g></svg>`;
}
function drawRoute(){
  const svg=$("routesvg");if(!svg)return;const path=svg.querySelector("#rprog");const L=path.getTotalLength();
  const tp=teamPct();path.setAttribute("stroke-dasharray",`${(L*tp).toFixed(1)} ${L+10}`);
  const n=D.people.length;let st="";
  D.people.forEach((p,i)=>{
    const pt=path.getPointAtLength(L*(i+1)/(n+1));const r=pct(p);const C=2*Math.PI*22;
    let lx=pt.x,ly=i%2===0?pt.y-44:pt.y+58,anchor="middle";
    if(pt.x>880){lx=pt.x-46;ly=pt.y+8;anchor="end"}else if(pt.x<140){lx=pt.x+46;ly=pt.y+8;anchor="start"}
    const label=(p.name||"").replace(/\s*\(ejemplo\)$/,"");const place=(p.place||"").trim();
    const py=anchor==="middle"&&i%2===0?ly-27:ly+24;
    st+=`<g><circle cx="${pt.x}" cy="${pt.y}" r="29" fill="#fff"/><circle cx="${pt.x}" cy="${pt.y}" r="22" fill="none" stroke="#E0E2D9" stroke-width="9"/>`+
      (r>0?`<circle cx="${pt.x}" cy="${pt.y}" r="22" fill="none" stroke="${r>=1?"var(--done)":"var(--prog)"}" stroke-width="9" stroke-dasharray="${(C*r).toFixed(1)} ${C}" transform="rotate(-90 ${pt.x} ${pt.y})" stroke-linecap="round"/>`:"")+
      (r>=1?`<path d="M${pt.x-10} ${pt.y+1} l7 7 l13 -15" fill="none" stroke="var(--done-dark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`:`<text x="${pt.x}" y="${pt.y+8}" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-weight="700" font-size="24" fill="var(--ink)">${esc((p.name||"?").trim().charAt(0).toUpperCase())}</text>`)+
      `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="Zen Maru Gothic, sans-serif" font-weight="700" font-size="26" fill="var(--ink)" paint-order="stroke" stroke="var(--sunk)" stroke-width="6">${esc(label)}</text>`+
      (place?`<text x="${lx}" y="${py}" text-anchor="${anchor}" font-family="Zen Maru Gothic, sans-serif" font-weight="500" font-size="19" fill="var(--accent-dark)" paint-order="stroke" stroke="var(--sunk)" stroke-width="5">${esc(place.length>22?place.slice(0,21)+"…":place)}</text>`:"")+`</g>`;
  });
  svg.querySelector("#rstations").innerHTML=st;
  const g=path.getPointAtLength(Math.max(0.001,L*tp));
  svg.querySelector("#rguide").innerHTML=tp>0?`<circle cx="${g.x}" cy="${g.y}" r="15" fill="var(--accent-dark)" stroke="#fff" stroke-width="5"/>`:"";
}

function saveSess(){
  const before={};D.people.forEach(p=>before[p.id]=pct(p));const tBefore=teamPct(),ptsBefore=teamPoints();
  D.sessions[sess.date]={att:{...sess.att},borg:{...sess.borg}};
  D.people.forEach(p=>{
    p.measures=(p.measures||[]).filter(m=>m.d!==sess.date);
    const v=num(sess.meas[p.id]);if(v!=null&&hasGoal(p))p.measures.push({d:sess.date,v});
  });
  save();
  const hits=[];
  D.people.forEach(p=>{const a=before[p.id],b=pct(p);const m=[.25,.5,.75,1].filter(m=>a<m&&b>=m).pop();if(m)hits.push({p,m})});
  const tAfter=teamPct(),gained=teamPoints()-ptsBefore;const n=Object.values(sess.att).filter(Boolean).length;
  const bs=Object.entries(sess.borg).filter(([id])=>sess.att[id]).map(([,v])=>v);const bm=bs.length?bs.reduce((a,b)=>a+b,0)/bs.length:null;
  const big=hits.length>0;
  const best=hits.slice().sort((a,b)=>b.m-a.m)[0];
  openDialog(`${big?pipaOf(best.p,{mood:"radiant"}):pipaSVG({name:"Pipa",pot:"ai",acc:"cinta"},{stage:Math.max(1,stageOf(tAfter)),mood:"happy"})}

    <p style="margin:0">Han venido <b>${n} de ${D.people.length}</b>${bm!=null?` · esfuerzo medio <b>${fmt(bm,1)}</b>`:""}.<br>${gained>0?`El equipo suma <b>+${fmt(gained)} puntos</b> y llega al <b>${Math.round(tAfter*100)} %</b> del recorrido.`:`El equipo está al <b>${Math.round(tAfter*100)} %</b> del recorrido.`}</p>
    ${big?`<ul>${hits.map(h=>`<li><b>${esc(h.p.name)}</b> ${h.m>=1?"¡ha conseguido su reto!":`llega al ${h.m*100} % de su reto`} · su Pipa es ${STAGES[stageOf(journey(h.p))]}</li>`).join("")}</ul>`:""}
    <button class="btn big" data-act="close" data-focus>¡Bien!</button>`,"cel");

/* ficha */
function chartSVG(p){
  if(!hasGoal(p))return "";
  const ms=goalMeasures(p);const g=p.goal;
  const d0=[g.since||p.created,ms[0]&&ms[0].d].filter(Boolean).sort()[0]||today();const pts=[{d:d0,v:g.start,base:true},...ms];
  if(pts.length<2)return `<p class="small muted" style="margin:0">Cuando apuntes la primera medida verás aquí su evolución.</p>`;
  const W=560,H=280,L=14,R=14,T=40,B=40;const FS=`font-size="21" font-family="Zen Maru Gothic, sans-serif" font-weight="700"`;
  let lo=Math.min(g.start,g.target,...ms.map(m=>m.v)),hi=Math.max(g.start,g.target,...ms.map(m=>m.v));if(hi===lo){hi+=1;lo-=1}
  const padv=(hi-lo)*.12;lo-=padv;hi+=padv;
  const t0=pd(pts[0].d).getTime(),t1=Math.max(pd(pts[pts.length-1].d).getTime(),t0+864e5);
  const x=d=>L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ln=(v,c,lab)=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${c}" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-R}" y="${(y(v)-8).toFixed(1)}" text-anchor="end" ${FS} fill="${c}">${lab} ${fmt(v,1)}</text>`;
  const path=pts.map((q,i)=>(i?"L":"M")+x(q.d).toFixed(1)+" "+y(q.v).toFixed(1)).join(" ");
  const dots=pts.map(q=>`<circle cx="${x(q.d).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="${q.base?6:7}" fill="${q.base?"#fff":"var(--ai)"}" stroke="var(--ai)" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${esc(p.name)}">${ln(g.target,"var(--done-dark)","objetivo")}${ln(g.start,"#A9ADA2","inicio")}<path d="${path}" fill="none" stroke="var(--ai)" stroke-width="4" stroke-linejoin="round"/>${dots}<text x="${L}" y="${H-8}" ${FS} fill="var(--muted)">${fmtD(pts[0].d)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" ${FS} fill="var(--muted)">${fmtD(pts[pts.length-1].d)}</text></svg>`;
}
